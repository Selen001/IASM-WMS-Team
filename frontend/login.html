
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | IASM-WMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="main-header">

        <a href="../index.html" class="brand">
            <img src="assets/logo.png" alt="IASM-WMS Logo">

            <div class="brand-text">
                <h5>IASM-WMS</h5>
                <span>Government of Maharashtra</span>
            </div>
        </a>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
            <i class="bi bi-list"></i>
        </button>

        <nav class="navigation" id="navigation">
            <a href="../index.html#home">Home</a>
            <a href="../index.html#about">About</a>
            <a href="../index.html#features">Features</a>
            <a href="../index.html#guidelines">Guidelines</a>
            <a href="../index.html#contact">Contact</a>
        </nav>

        <div class="header-tagline">
            Education <span>•</span> Care <span>•</span> Welfare
        </div>

    </header>


    <!-- Login Background -->
    <main class="login-section">

        <div class="login-overlay"></div>

        <!-- Login Card -->
        <div class="login-card">

            <!-- Login / Register Tabs -->
            <div class="auth-tabs">
                <a href="login.html" class="auth-tab active">Login</a>
                <a href="register.html" class="auth-tab">Register</a>
            </div>

            <!-- Login Heading -->
            <div class="login-heading">
                <h1>Welcome Back!</h1>
                <p>Login to access your dashboard</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">
                    <span class="input-icon">
                        <i class="bi bi-person"></i>
                    </span>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Username / Email"
                        autocomplete="username"
                        required
                    >
                </div>


                <div class="form-group">
                    <span class="input-icon">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                    <button type="button" class="password-toggle" id="togglePassword"
                            aria-label="Show password">
                        <i class="bi bi-eye-slash"></i>
                    </button>
                </div>


                <!-- Remember Me and Forgot Password -->
                <div class="form-options">

                    <label class="remember-option">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Remember Me</span>
                    </label>

                    <a href="#" id="forgotPassword">Forgot Password?</a>

                </div>


                <!-- Login Button -->
                <button type="submit" class="login-button">
                    Login
                </button>

                <div class="or-divider">
                    <span>or</span>
                </div>


                <!-- Registration Access -->
                <a href="register.html" class="request-button">
                    Request Access
                </a>

                <p id="formMessage" class="form-message" role="status"></p>

            </form>


            <!-- Back to Home -->
            <a href="../index.html" class="back-home">
                <i class="bi bi-house-door-fill"></i>
                Back to Home
            </a>

        </div>

    </main>

    <script src="js/login.js"></script>

</body>
</html>
