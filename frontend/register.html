
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | IASM-WMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

<header class="main-header">
    <a href="../index.html" class="brand">
        <img src="assets/logo.png" alt="IASM-WMS Logo">
        <div class="brand-text">
            <h5>IASM-WMS</h5>
            <span>Government of Maharashtra</span>
        </div>
    </a>

    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
    </button>

    <nav class="navigation" id="navigation">
        <a href="../index.html#home">Home</a>
        <a href="../index.html#about">About</a>
        <a href="../index.html#features">Features</a>
        <a href="../index.html#guidelines">Guidelines</a>
        <a href="../index.html#contact">Contact</a>
    </nav>

    <div class="header-tagline">
        Education <span>•</span> Care <span>•</span> Welfare
    </div>
</header>

<main class="register-section">
    <div class="register-overlay"></div>

    <div class="register-card">
        <div class="auth-tabs">
            <a href="login.html" class="auth-tab">Login</a>
            <a href="register.html" class="auth-tab active">Register</a>
        </div>

        <div class="register-heading">
            <h1>Create Your Account</h1>
            <p>Register to access the IASM-WMS platform</p>
        </div>

        <form class="register-form" id="registerForm">

            <div class="form-row">
                <div class="form-group">
                    <span class="input-icon"><i class="bi bi-person"></i></span>
                    <input type="text" id="fullName" placeholder="Full Name" required>
                </div>

                <div class="form-group">
                    <span class="input-icon"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>
            </div>

            <div class="form-group">
                <span class="input-icon"><i class="bi bi-person-badge"></i></span>
                <input type="text" value="School Staff" readonly aria-label="Registration role">
            </div>

            <div class="form-group">
                <span class="input-icon"><i class="bi bi-building"></i></span>
                <select id="school" required>
                    <option value="">Loading schools...</option>
                </select>
            </div>

            <div class="form-group password-field">
                <span class="input-icon"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" placeholder="Create Password" minlength="8" required>

                <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                    <i class="bi bi-eye-slash"></i>
                </button>
            </div>

            <div class="form-group password-field">
                <span class="input-icon"><i class="bi bi-shield-lock"></i></span>
                <input type="password" id="confirmPassword" placeholder="Confirm Password" minlength="8" required>

                <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Show confirm password">
                    <i class="bi bi-eye-slash"></i>
                </button>
            </div>

            <label class="terms-option">
                <input type="checkbox" id="terms" required>
                <span>
                    I agree to the system terms and conditions and confirm
                    that the information provided is correct.
                </span>
            </label>

            <button type="submit" class="register-button" id="registerButton">
                Create Account
            </button>

            <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login here</a>
        </div>

        <a href="../index.html" class="back-home">
            <i class="bi bi-house-door-fill"></i>
            Back to Home
        </a>
    </div>
</main>

<script src="js/register.js"></script>
</body>
</html>
